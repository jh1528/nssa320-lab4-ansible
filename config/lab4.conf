# ==============================================================================
# NSSA320 Lab 4 - Activity 1 Network Configuration
# ==============================================================================
#
# Purpose:
#   This file is the single source of truth for Activity 1.
#   Scripts source this file so hostnames, IP addresses, gateway, DNS, and
#   validation targets are not hardcoded in multiple places.
#
# RICE Framework:
#   Reproducibility - One config file defines the lab network.
#   Idempotency     - Scripts compare/apply the same desired state every run.
#   Composability   - Other scripts import this file as needed.
#   Evolvability    - The subnet/domain can be changed here later.
#
# Security Note:
#   Do NOT store passwords, GitHub tokens, private SSH keys, or secrets here.
# ==============================================================================


# ------------------------------------------------------------------------------
# Domain and subnet
# ------------------------------------------------------------------------------

DOMAIN="jh1528.com"

NETWORK_CIDR="172.16.5.0/29"
SUBNET_PREFIX="29"
SUBNET_MASK="255.255.255.248"
BROADCAST_IP="172.16.5.7"


# ------------------------------------------------------------------------------
# Gateway / pfSense
# ------------------------------------------------------------------------------

GATEWAY_HOST="gateway"
GATEWAY_IP="172.16.5.6"
GATEWAY_FQDN="${GATEWAY_HOST}.${DOMAIN}"


# ------------------------------------------------------------------------------
# Linux nodes
# ------------------------------------------------------------------------------

CONTROL_HOST="control"
CONTROL_IP="172.16.5.5"
CONTROL_FQDN="${CONTROL_HOST}.${DOMAIN}"

ANSIBLE1_HOST="ansible1"
ANSIBLE1_IP="172.16.5.1"
ANSIBLE1_FQDN="${ANSIBLE1_HOST}.${DOMAIN}"

ANSIBLE2_HOST="ansible2"
ANSIBLE2_IP="172.16.5.2"
ANSIBLE2_FQDN="${ANSIBLE2_HOST}.${DOMAIN}"

UBUNTU_HOST="ubuntu"
UBUNTU_IP="172.16.5.3"
UBUNTU_FQDN="${UBUNTU_HOST}.${DOMAIN}"

RESERVED_IP="172.16.5.4"


# ------------------------------------------------------------------------------
# DNS
# ------------------------------------------------------------------------------
#
# Local lab hostnames are resolved with /etc/hosts in Activity 1.
# DNS here is only for external internet name resolution.
# ------------------------------------------------------------------------------

DNS_SERVERS="8.8.8.8 1.1.1.1"


# ------------------------------------------------------------------------------
# Users
# ------------------------------------------------------------------------------

LAB_USER="student"
ANSIBLE_SERVICE_USER="ansible"


# ------------------------------------------------------------------------------
# Activity 1 validation targets
# ------------------------------------------------------------------------------
#
# validate-connectivity.sh will ping these names from the control node.
# These must resolve through /etc/hosts.
# ------------------------------------------------------------------------------

PING_TARGETS="gateway ansible1 ansible2 ubuntu"
