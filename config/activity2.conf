# NSSA320 Lab 4 - Activity 2 Configuration
# File: config/activity2.conf
#
# Purpose:
#   Stores Activity 2-specific configuration values for preparing the
#   RHEL 8 control node as the Ansible control node.
#
# Scope:
#   Activity 2 only.
#   This file should not contain passwords, Red Hat credentials,
#   GitHub tokens, SSH private keys, or other secrets.
#
# Design Notes:
#   config/lab4.conf remains the global Lab 4 configuration file.
#   config/activity2.conf stores only Activity 2-specific values.
#
# RICE Notes:
#   Reproducibility - keeps Activity 2 values in one predictable location.
#   Idempotency     - supports repeatable scripts by centralizing expected values.
#   Composability   - can be sourced by multiple Activity 2 scripts.
#   Evolvability    - can be extended for future Activity 2 checks.
#
# Version History:
#   v2.0 - Initial Activity 2 configuration values.
#   v2.1 - Added Figure 2 screenshot and terminal evidence settings.
#   v2.1.1 - Added hostname and date to required command checks.

# ---------------------------------------------------------------------------
# Activity metadata
# ---------------------------------------------------------------------------

ACTIVITY2_VERSION="v2.1.1"
ACTIVITY2_NAME="Setting Up the Ansible Control Node"

# ---------------------------------------------------------------------------
# Evidence paths
# ---------------------------------------------------------------------------

# Uses EVIDENCE_ROOT from config/lab4.conf if it exists.
# Falls back to evidence if this file is sourced by itself.
ACTIVITY2_EVIDENCE_DIR="${EVIDENCE_ROOT:-evidence}/activity2"

ACTIVITY2_VERIFY_OUTPUT="${ACTIVITY2_EVIDENCE_DIR}/control-node-verification.txt"
ACTIVITY2_FIGURE2_OUTPUT="${ACTIVITY2_EVIDENCE_DIR}/figure2-terminal-output.txt"
ACTIVITY2_FIGURE2_SCREENSHOT="${ACTIVITY2_EVIDENCE_DIR}/figure2-ansible-install-verification.png"

# Number of seconds to wait before capturing the terminal screenshot.
ACTIVITY2_SCREENSHOT_DELAY_SECONDS="5"

# ---------------------------------------------------------------------------
# Red Hat / repository configuration
# ---------------------------------------------------------------------------

# The lab requires CodeReady Builder for RHEL 8 x86_64.
# This value is used for validation only.
# Registration and repository enabling should remain manual unless explicitly
# handled by a future controlled workflow.
ACTIVITY2_REQUIRED_REPO_KEYWORD="codeready-builder"

# Do not enable the deprecated Red Hat Ansible Engine 2 repository.
ACTIVITY2_DEPRECATED_REPO_KEYWORD="ansible-2"

# ---------------------------------------------------------------------------
# EPEL configuration
# ---------------------------------------------------------------------------

# EPEL RPM URL required by the lab instructions for RHEL 8.
ACTIVITY2_EPEL_RPM_URL="https://dl.fedoraproject.org/pub/epel/epel-release-latest-8.noarch.rpm"

# Package name used to check whether EPEL is already installed.
ACTIVITY2_EPEL_PACKAGE="epel-release"

# ---------------------------------------------------------------------------
# Package configuration
# ---------------------------------------------------------------------------

# Packages required for Activity 2.
ACTIVITY2_REQUIRED_PACKAGES=(
  ansible
)

# Commands expected after Activity 2 setup.
# hostname, date, and ansible are required for Figure 2 evidence:
#   hostname; date; ansible --version
ACTIVITY2_REQUIRED_COMMANDS=(
  hostname
  date
  ansible
  python3
  dnf
  subscription-manager
)
