# NSSA320 Lab 4 - Activity 3 Configuration
# File: config/activity3.conf
#
# Purpose:
#   Stores Activity 3-specific configuration values for preparing the
#   managed hosts for Ansible access and key-based authentication.
#
# Scope:
#   Activity 3 only.
#   This file should not contain passwords, Red Hat credentials,
#   GitHub tokens, SSH private keys, SSH public keys, or other secrets.
#
# Design Notes:
#   config/lab4.conf remains the global Lab 4 configuration file.
#   config/activity3.conf stores only Activity 3-specific values.
#   The actual Ansible inventory file required by the lab is created at
#   ~/lab4/inventory.inv, not inside the repository config directory.
#
# RICE Notes:
#   Reproducibility - keeps Activity 3 values in one predictable location.
#   Idempotency     - supports repeatable scripts by centralizing expected values.
#   Composability   - can be sourced by multiple Activity 3 scripts.
#   Evolvability    - can be extended for future Activity 3 checks.
#
# Version History:
#   v3.0 - Initial Activity 3 configuration values.

# ---------------------------------------------------------------------------
# Activity metadata
# ---------------------------------------------------------------------------

ACTIVITY3_VERSION="v3.0"
ACTIVITY3_NAME="Setting Up Managed Hosts"

# ---------------------------------------------------------------------------
# Evidence paths
# ---------------------------------------------------------------------------

# Uses EVIDENCE_ROOT from config/lab4.conf if it exists.
# Falls back to evidence if this file is sourced by itself.
ACTIVITY3_EVIDENCE_DIR="${EVIDENCE_ROOT:-evidence}/activity3"
ACTIVITY3_ARCHIVE_DIR="${ACTIVITY3_EVIDENCE_DIR}/archive"

ACTIVITY3_SETUP_OUTPUT="${ACTIVITY3_EVIDENCE_DIR}/managed-hosts-setup.txt"
ACTIVITY3_VERIFY_OUTPUT="${ACTIVITY3_EVIDENCE_DIR}/managed-hosts-verification.txt"
ACTIVITY3_FIGURE3_OUTPUT="${ACTIVITY3_EVIDENCE_DIR}/figure3-key-authentication-test.txt"
ACTIVITY3_FIGURE3_SCREENSHOT="${ACTIVITY3_EVIDENCE_DIR}/figure3-key-authentication-test.png"

# Optional learning/evidence files for comparing first run vs idempotent rerun.
ACTIVITY3_USER_CREATE_FIRST_RUN_OUTPUT="${ACTIVITY3_EVIDENCE_DIR}/ansible-user-create-first-run.txt"
ACTIVITY3_USER_CREATE_IDEMPOTENT_OUTPUT="${ACTIVITY3_EVIDENCE_DIR}/ansible-user-create-idempotent-rerun.txt"

# Number of seconds to wait before capturing the terminal screenshot.
ACTIVITY3_SCREENSHOT_DELAY_SECONDS="5"

# ---------------------------------------------------------------------------
# Lab directory / inventory configuration
# ---------------------------------------------------------------------------

# Lab instructions use ~/lab4/inventory.inv for Activity 3 and Activity 4.
ACTIVITY3_LAB_DIR="${HOME}/lab4"
ACTIVITY3_INVENTORY_FILE="${ACTIVITY3_LAB_DIR}/inventory.inv"

# Expected inventory content.
# This content is written idempotently by scripts/setup-managed-hosts.sh.
ACTIVITY3_INVENTORY_CONTENT='[ubuntu_hosts]
ubuntu

[rocky_hosts]
ansible1
ansible2
'

# ---------------------------------------------------------------------------
# Managed host configuration
# ---------------------------------------------------------------------------

# The lab connects to managed hosts as the student user.
ACTIVITY3_REMOTE_USER="student"

# The lab creates a dedicated Ansible service account on each managed host.
ACTIVITY3_SERVICE_USER="ansible"

ACTIVITY3_UBUNTU_HOSTS=(
  ubuntu
)

ACTIVITY3_ROCKY_HOSTS=(
  ansible1
  ansible2
)

ACTIVITY3_MANAGED_HOSTS=(
  ubuntu
  ansible1
  ansible2
)

# ---------------------------------------------------------------------------
# SSH configuration
# ---------------------------------------------------------------------------

# Default SSH key path for the control node.
# Scripts should reuse an existing key and only generate one if missing.
ACTIVITY3_SSH_KEY_PATH="${HOME}/.ssh/id_rsa"
ACTIVITY3_SSH_PUBLIC_KEY_PATH="${ACTIVITY3_SSH_KEY_PATH}.pub"

# Used for SSH connection checks.
ACTIVITY3_SSH_CONNECT_TIMEOUT_SECONDS="10"

# ---------------------------------------------------------------------------
# Ansible ad-hoc command configuration
# ---------------------------------------------------------------------------

# Required commands expected for Activity 3 workflows.
ACTIVITY3_REQUIRED_COMMANDS=(
  hostname
  date
  ssh
  ssh-keygen
  ssh-copy-id
  ansible
)

# Groups expected in the generated inventory.
ACTIVITY3_UBUNTU_GROUP="ubuntu_hosts"
ACTIVITY3_ROCKY_GROUP="rocky_hosts"
ACTIVITY3_ALL_GROUP="all"
