# NSSA320 Lab 4 - Activity 4 Configuration
# File: config/activity4.conf
#
# Purpose:
# Stores Activity 4-specific configuration values for automating access
# and privileged escalation with Ansible.
#
# Scope:
# Activity 4 only.
# This file should not contain passwords, Red Hat credentials,
# GitHub tokens, SSH private keys, SSH public keys, or other secrets.
#
# Design Notes:
# config/lab4.conf remains the global Lab 4 configuration file.
# config/activity3.conf remains the Activity 3 managed-host configuration.
# config/activity4.conf stores only Activity 4-specific values.
#
# RICE Notes:
# Reproducibility - keeps Activity 4 values in one predictable location.
# Idempotency - supports repeatable scripts by centralizing expected values.
# Composability - can be sourced by multiple Activity 4 scripts.
# Evolvability - can be extended for future Activity 4 checks.
#
# Version History:
# v4.0 - Initial Activity 4 configuration values.

# ---------------------------------------------------------------------------
# Activity metadata
# ---------------------------------------------------------------------------
ACTIVITY4_VERSION="v4.0"
ACTIVITY4_NAME="Automating Access and Privileged Escalation"

# ---------------------------------------------------------------------------
# Evidence paths
# ---------------------------------------------------------------------------
ACTIVITY4_EVIDENCE_DIR="${EVIDENCE_ROOT:-evidence}/activity4"
ACTIVITY4_ARCHIVE_DIR="${ACTIVITY4_EVIDENCE_DIR}/archive"

ACTIVITY4_SETUP_OUTPUT="${ACTIVITY4_EVIDENCE_DIR}/privilege-escalation-setup.txt"
ACTIVITY4_VERIFY_OUTPUT="${ACTIVITY4_EVIDENCE_DIR}/privilege-escalation-verification.txt"
ACTIVITY4_FIGURE4_OUTPUT="${ACTIVITY4_EVIDENCE_DIR}/figure4-privilege-escalation-test.txt"
ACTIVITY4_FIGURE4_SCREENSHOT="${ACTIVITY4_EVIDENCE_DIR}/figure4-privilege-escalation-test.png"

ACTIVITY4_SCREENSHOT_DELAY_SECONDS="5"

# ---------------------------------------------------------------------------
# Lab directory / inventory configuration
# ---------------------------------------------------------------------------
# Activity 4 reuses the lab inventory created during Activity 3.
ACTIVITY4_LAB_DIR="${HOME}/lab4"
ACTIVITY4_INVENTORY_FILE="${ACTIVITY4_LAB_DIR}/inventory.inv"

# ---------------------------------------------------------------------------
# Managed host configuration
# ---------------------------------------------------------------------------
ACTIVITY4_REMOTE_USER="student"
ACTIVITY4_SERVICE_USER="ansible"

ACTIVITY4_UBUNTU_GROUP="ubuntu_hosts"
ACTIVITY4_ROCKY_GROUP="rocky_hosts"
ACTIVITY4_ALL_GROUP="all"

ACTIVITY4_MANAGED_HOSTS=( ubuntu ansible1 ansible2 )

# ---------------------------------------------------------------------------
# Privilege escalation configuration
# ---------------------------------------------------------------------------
ACTIVITY4_SUDOERS_FILE="/etc/sudoers.d/ansible"
ACTIVITY4_SUDOERS_MODE="0440"
ACTIVITY4_SUDOERS_CONTENT="ansible ALL=(ALL) NOPASSWD: ALL"

# ---------------------------------------------------------------------------
# Ansible configuration
# ---------------------------------------------------------------------------
ACTIVITY4_ANSIBLE_CFG="${ACTIVITY4_LAB_DIR}/ansible.cfg"

# ---------------------------------------------------------------------------
# Required commands
# ---------------------------------------------------------------------------
ACTIVITY4_REQUIRED_COMMANDS=( hostname date ssh ansible )
